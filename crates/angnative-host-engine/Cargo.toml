[package]
name = "angnative-host-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
rquickjs.workspace = true
angnative-host-core = { path = "../angnative-host-core" }
anyhow = "1.0"

# rquickjs-sys 0.14 ships pregenerated bindings for desktop targets only.
# Android needs bindgen, driven by LIBCLANG_PATH / BINDGEN_EXTRA_CLANG_ARGS
# in scripts/build-android-native.{sh,ps1}.
[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.14", features = ["bindgen", "classes", "chrono"] }
