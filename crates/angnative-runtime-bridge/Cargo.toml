[package]
name = "angnative-runtime-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Bridge between the AngNative host and embedded JavaScript runtime"

[lib]
# Bundles the host FFI and QuickJS runtime for native platform shells.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
angnative-host-ffi = { path = "../angnative-host-ffi" }
angnative-host-engine = { path = "../angnative-host-engine" }
anyhow = "1.0"
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
angnative-host-core = { path = "../angnative-host-core" }
angnative-host-view = { path = "../angnative-host-view" }
