name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain
        run: pnpm run check:toolchain

      - name: Build workspace packages (deterministic)
        run: pnpm run build:packages

      - name: Run JS/TS tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust crates
        run: cargo check --workspace

      - name: Run Rust tests (workspace)
        run: cargo test --workspace

      - name: Check FFI declarations (JNI / Swift / C header)
        run: python3 scripts/check-ffi-declarations.py

  # Headline feature protection: the Angular-in-QuickJS acceptance tests are
  # #[ignore] by default because dist/ is gitignored. Generate the bundles and
  # run them explicitly so a regression in the runtime -> native pipeline or
  # the FFI surface cannot land silently.
  angular-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (deterministic)
        run: pnpm run build:packages

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Compile Angular AOT (main + router/forms/i18n/animations apps)
        run: |
          pnpm run compile:aot
          pnpm run compile:aot:router
          pnpm run compile:aot:forms
          pnpm run compile:aot:i18n
          pnpm run compile:aot:animations
          pnpm run compile:aot:marketpulse

      - name: Build self-contained QuickJS bundles
        run: |
          pnpm run bundle:quickjs
          pnpm run bundle:forms
          pnpm run bundle:framework
          pnpm run bundle:third-party
          pnpm run bundle:marketpulse

      - name: Run Angular-in-QuickJS acceptance tests
        run: cargo test -p angnative-runtime-bridge -- --ignored

  # Real device-side proof: build the flagship shell, boot an API-34 emulator,
  # install/launch the APK and assert the status label that reports the Host's
  # native node count after the Angular AOT bundle loaded in QuickJS.
  android-e2e:
    needs: angular-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Install Rust toolchain for Android
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Build unified Android Rust libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          LIBCLANG_CANDIDATE="$(find /usr/lib -name 'libclang.so*' -print -quit)"
          test -n "$LIBCLANG_CANDIDATE"
          export LIBCLANG_PATH="$(dirname "$(readlink -f "$LIBCLANG_CANDIDATE")")"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}" >> "$GITHUB_ENV"
          bash scripts/build-android-native.sh all

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            -n angnative-ci \
            -k "system-images;android-34;google_apis;x86_64" \
            -d pixel_5 --force

      - name: Setup pnpm / Node and regenerate bundles
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages (deterministic)
        run: pnpm run build:packages

      - name: Regenerate the Angular bundle asset
        run: |
          pnpm run compile:aot
          pnpm run bundle:quickjs
          cp dist/aot/quickjs-bundle.js \
            showcases/ecosystem-core/app/src/main/assets/angnative-bundle.js

      - name: Build ecosystem-core APK
        working-directory: showcases/ecosystem-core
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Boot emulator
        run: |
          EMU_BIN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/emulator/emulator"
          test -x "$EMU_BIN"
          if [[ ! -e /dev/kvm ]]; then
            echo "/dev/kvm is missing; the x86_64 AVD cannot boot without acceleration"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          if [[ ! -r /dev/kvm ]]; then
            echo "/dev/kvm is still not readable"
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
          EMU_ARGS=(-avd angnative-ci -no-window -no-audio -no-snapshot -gpu swiftshader -no-boot-anim)
          nohup "$EMU_BIN" "${EMU_ARGS[@]}" > /tmp/emulator.log 2>&1 &
          if ! timeout 600 adb wait-for-device; then
            echo "emulator did not reach adb; /tmp/emulator.log follows"
            cat /tmp/emulator.log
            exit 1
          fi
          for i in $(seq 1 180); do
            boot=$(adb shell getprop sys.boot_completed | tr -d '\r')
            if [ "$boot" = "1" ]; then echo "booted"; break; fi
            sleep 5
          done
          if ! adb shell getprop sys.boot_completed | grep -q 1; then
            echo "emulator boot did not complete; /tmp/emulator.log follows"
            cat /tmp/emulator.log
            adb logcat -d | tail -n 200 || true
            exit 1
          fi

      - name: Install and launch
        run: |
          adb install -r showcases/ecosystem-core/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell monkey -p com.angnative.demo.ecosystem.core \
            -c android.intent.category.LAUNCHER 1
          sleep 20

      - name: Assert Angular produced native nodes on-device
        run: |
          adb shell uiautomator dump /sdcard/window.xml > /dev/null
          adb pull /sdcard/window.xml /tmp/window.xml
          grep -qE 'Angular in Rust: nodes=[1-9][0-9]* rc=0 plusNode=[0-9]+' /tmp/window.xml
          echo "Angular-in-QuickJS on-device assertion passed"

      - name: Assert a real tap reaches the Angular listener
        run: |
          coords=$(python3 scripts/android-tap-coords.py /tmp/window.xml)
          echo "Angular plus tap coords: $coords"
          adb logcat -c
          adb shell input tap $coords
          sleep 3
          log=$(adb logcat -d -s AngNative:I)
          echo "AngNative log after tap:"
          echo "$log"
          adb shell uiautomator dump /sdcard/after.xml > /dev/null
          adb pull /sdcard/after.xml /tmp/after.xml
          echo "Count nodes after tap:"
          grep -o 'text="Count: [0-9]*"' /tmp/after.xml || true
          if ! echo "$log" | grep -qE 'Angular tap node=[0-9]+ -> [1-9]'; then
            echo "Angular listener was not reached by the real tap"
            exit 1
          fi
          if ! grep -q 'Count: 1' /tmp/after.xml; then
            echo "Count: 1 was not rendered after the real tap"
            exit 1
          fi
          echo "Angular real-tap -> native UI update assertion passed"

  size:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust core size gate: pinned toolchain + --host on this Linux runner.
      # Apple (aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios)
      # and Windows (x86_64-pc-windows-msvc) targets are explicitly skipped:
      # their toolchains/targets are unavailable here. Android targets require
      # an explicitly installed target and are not measured by this job.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust core size budget (gate)
        run: node scripts/check-rust-size.mjs --host

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (deterministic)
        run: pnpm run build:packages

      - name: Build web adapter and AOT browser bundle
        run: |
          pnpm --filter @angnative/web run build
          pnpm run compile:aot:web
          pnpm run bundle:aot:web

      - name: Check web demo size budget (gate)
        run: pnpm check:web-size

      - name: Generate fixture entry
        run: pnpm run compile:fixtures

      - name: Build production bundle
        run: pnpm run bundle:fixtures

      - name: Check JS size budget (gate)
        run: node scripts/check-size-budget.mjs
