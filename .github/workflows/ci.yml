name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain
        run: pnpm run check:toolchain

      - name: Build TypeScript
        run: pnpm run build

      - name: Run JS/TS tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-14

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Rust crates
        run: cargo check --workspace

      - name: Run Rust tests (workspace)
        run: cargo test --workspace

  size:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate fixture entry
        run: pnpm run compile:fixtures

      - name: Build production bundle
        run: pnpm run bundle:fixtures

      - name: Check JS size budget (gate)
        run: node scripts/check-size-budget.mjs
